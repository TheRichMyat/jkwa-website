# Free Supabase projects pause after 7 days without activity, and a quiet site
# may not call Supabase for a week (pages are cached). This does one tiny read
# every day so the project stays awake. Costs no Netlify credits.
#
# Needs two repo secrets (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_URL              e.g. https://xxxx.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the sb_publishable_… (or legacy anon) key
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC (11:17 Singapore)
  workflow_dispatch: # "Run workflow" button for a manual check

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing repo secrets SUPABASE_URL and/or SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/settings?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase keep-alive failed with HTTP $status"
            cat response.json
            exit 1
          fi
          echo "Supabase is awake."
